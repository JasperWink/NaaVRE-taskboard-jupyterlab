<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="20"
   height="20"
   version="1.1"
   viewBox="0 0 20 20"
   xmlns="http://www.w3.org/2000/svg">
  <g
     fill="none"
     stroke="#3c8f49"
     stroke-width="1.6"
     stroke-linecap="round"
     stroke-linejoin="round">
    <!-- board outline -->
    <rect x="2" y="2.5" width="16" height="15" rx="1.5" />
    <!-- column divider -->
    <line x1="10" y1="2.5" x2="10" y2="17.5" />
    <!-- cards in left column -->
    <line x1="4.5" y1="6" x2="7.5" y2="6" />
    <line x1="4.5" y1="9" x2="7.5" y2="9" />
    <!-- cards in right column -->
    <line x1="12.5" y1="6" x2="15.5" y2="6" />
    <line x1="12.5" y1="9" x2="15.5" y2="9" />
    <line x1="12.5" y1="12" x2="15.5" y2="12" />
  </g>
</svg>
