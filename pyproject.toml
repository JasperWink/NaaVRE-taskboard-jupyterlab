[build-system]
requires = ["hatchling>=1.5.0", "jupyterlab>=4.0.0,<5", "hatch-nodejs-version>=0.3.2"]
build-backend = "hatchling.build"

[project]
name = "NaaVRE_taskboard_jupyterlab"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
classifiers = [
    "Framework :: Jupyter",
    "Framework :: Jupyter :: JupyterLab",
    "Framework :: Jupyter :: JupyterLab :: 4",
    "Framework :: Jupyter :: JupyterLab :: Extensions",
    "Framework :: Jupyter :: JupyterLab :: Extensions :: Prebuilt",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
]
dynamic = ["version", "description", "authors", "urls", "keywords"]

# Optional RTC on the board. The labextensions ship in -ui/-docprovider, which
# jupyter-collaboration pins only as <3, so pin all three: they must match
# package.json's ~4.4.2 singletons. 4.4.2 is also the fix for GHSA-8w8w-78q2-76qw
# (unauthenticated RTC timeline/undo endpoints), and needs Python >= 3.10.
# JupyterLab is held at 4.5 because 4.6 bundles @jupyter/ydoc v4, which this
# line does not accept; moving up means the jupyter-collaboration 5.0 line.
[project.optional-dependencies]
collaboration = [
    "jupyter-collaboration>=5.0.2,<5.1",
    "jupyter-collaboration-ui>=2.4.2,<2.5",
    "jupyter-docprovider>=2.4.2,<2.5",
    "jupyterlab>=4.5,<4.6",
]
test = [
    "pytest>=7",
    # tests/test_ydoc.py needs jupyter_ydoc present to check that our entry
    # point resolves to YBoard rather than the generic YFile.
    "jupyter-collaboration>=5.0.2,<5.1",
]

# Register the server-side shared document for .naavretb files. The
# entry-point name MUST equal the document's file type ('naavretbdoc', see
# src/boardModel.ts and src/index.ts): jupyter_server_ydoc resolves the class
# via YDOCS.get(file_type) and would otherwise silently fall back to the
# generic YFile, leaving the board looking fine but never syncing.
[project.entry-points.jupyter_ydoc]
naavretbdoc = "NaaVRE_taskboard_jupyterlab.ydoc:YBoard"

[tool.hatch.version]
source = "nodejs"

[tool.hatch.metadata.hooks.nodejs]
fields = ["description", "authors", "urls", "keywords"]

[tool.hatch.build.targets.sdist]
artifacts = ["NaaVRE_taskboard_jupyterlab/labextension"]
exclude = [".github", "binder"]

[tool.hatch.build.targets.wheel.shared-data]
"NaaVRE_taskboard_jupyterlab/labextension" = "share/jupyter/labextensions/@naavre/taskboard-jupyterlab"
"install.json" = "share/jupyter/labextensions/@naavre/taskboard-jupyterlab/install.json"

[tool.hatch.build.hooks.version]
path = "NaaVRE_taskboard_jupyterlab/_version.py"

[tool.hatch.build.hooks.jupyter-builder]
dependencies = ["hatch-jupyter-builder>=0.5"]
build-function = "hatch_jupyter_builder.npm_builder"
ensured-targets = [
    "NaaVRE_taskboard_jupyterlab/labextension/static/style.js",
    "NaaVRE_taskboard_jupyterlab/labextension/package.json",
]
skip-if-exists = ["NaaVRE_taskboard_jupyterlab/labextension/static/style.js"]

[tool.hatch.build.hooks.jupyter-builder.build-kwargs]
build_cmd = "build:prod"
npm = ["jlpm"]

[tool.hatch.build.hooks.jupyter-builder.editable-build-kwargs]
build_cmd = "install:extension"
npm = ["jlpm"]
source_dir = "src"
build_dir = "NaaVRE_taskboard_jupyterlab/labextension"

[tool.jupyter-releaser.options]
version_cmd = "hatch version"

[tool.jupyter-releaser.hooks]
before-build-npm = [
    "python -m pip install 'jupyterlab>=4.0.0,<5'",
    "jlpm",
    "jlpm build:prod"
]
before-build-python = ["jlpm clean:all"]

[tool.check-wheel-contents]
ignore = ["W002"]
